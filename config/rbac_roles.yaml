roles:
  SOC_ANALYST:
    permissions:
      - "telemetry:read"
      - "incidents:read"
      - "alerts:read"
      - "audit:read"

  SECURITY_ADMIN:
    permissions:
      - "telemetry:read"
      - "incidents:read"
      - "incidents:write"
      - "playbooks:execute"
      - "playbooks:approve"
      - "safety:kill_switch"
      - "audit:read"

  SYSTEM_SERVICE:
    permissions:
      - "telemetry:ingest"
      - "incidents:create"
      - "audit:write"
