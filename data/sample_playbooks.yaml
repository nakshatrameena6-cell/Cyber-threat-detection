playbooks:
  - id: "pb-enrich-and-notify"
    name: "Enrich Incident and Notify SOC"
    target_entity_type: "host"
    risk_tier: "TIER_1"
    steps:
      - name: "notify_slack"
        action: "send_slack_notification"
        args:
          channel: "#soc-alerts"
          message: "New incident requires analyst review"
      - name: "enrich_host"
        action: "gather_host_forensics"
        args:
          depth: "standard"
